<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Selo de bairro · Bairro Ideal</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:#1b1f1d;background:transparent}
.sel{--m:#0b6b56;border:1px solid #dfe3de;border-radius:14px;background:#fff;padding:14px 16px;max-width:520px;margin:0 auto}
.topo{display:flex;align-items:center;gap:14px}
.nota{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.5rem;color:#fff;line-height:1}
.nota small{display:block;font-size:.62rem;font-weight:600;opacity:.9;margin-top:2px}
h1{font-size:1.05rem;line-height:1.25}
.sub{color:#5a625e;font-size:.82rem}
.temas{list-style:none;padding:0;margin:12px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.temas li{font-size:.8rem}
.temas span{display:flex;justify-content:space-between}
.barra{height:6px;border-radius:3px;background:#eef0ed;margin-top:2px;overflow:hidden}
.barra i{display:block;height:100%}
.preco{margin:10px 0 0;font-size:.85rem;color:#3a413d}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.zap{background:var(--m);color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:.55rem .95rem;border-radius:999px}
.rodape{margin-left:auto;font-size:.72rem;color:#7a827e;text-decoration:none}
.rodape b{color:var(--m)}
.erro{font-size:.85rem;color:#7a5200;background:#fff6e5;border-radius:10px;padding:.6rem .8rem}
@media(max-width:380px){.temas{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sel" id="sel"><p class="sub">Carregando…</p></div>
<script src="/static/embed.js?v=7b02b27e"></script>
</body>
</html>
